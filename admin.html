<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Artículos Ferreteros EH</title>
  <meta name="description" content="Panel administrativo para gestionar el catálogo, precios y productos de Artículos Ferreteros EH.">
  <meta name="theme-color" content="#0f2237">
  <meta property="og:title" content="Admin | Artículos Ferreteros EH">
  <meta property="og:description" content="Administración del catálogo de productos ferreteros en línea.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://erickh-articulos-ferreteros-eh.netlify.app/admin.html">
  <meta property="og:image" content="https://erickh-articulos-ferreteros-eh.netlify.app/pm_pixian_ai2.png">
  <link rel="canonical" href="https://erickh-articulos-ferreteros-eh.netlify.app/admin.html">
  <link rel="icon" href="./assets/logo-ferreteria-eh.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="admin-page">
  <main class="admin-shell">
    <section class="admin-topbar">
      <div>
        <h1>Administración de Catálogo</h1>
        <p>Alta, edición y eliminación de productos en tiempo real.</p>
      </div>
      <div class="admin-actions">
        <a href="./index.html" class="text-link">Ver tienda</a>
        <button id="logout-button" type="button" class="danger-btn">Cerrar sesión</button>
      </div>
    </section>

    <section class="admin-grid">
      <article class="admin-card">
        <h2 id="form-title">Agregar producto</h2>
        <form id="product-form" class="form-stack">
          <input type="hidden" id="product-id">

          <label for="product-name">Nombre</label>
          <input id="product-name" required placeholder="Ej: Taladro inalámbrico 18V">

          <label for="product-price">Precio</label>
          <input id="product-price" required placeholder="Ej: C$ 2,500">

          <label for="product-category">Categoría</label>
          <select id="product-category" required>
            <option value="Herramientas Manuales">Herramientas Manuales</option>
            <option value="Herramientas Electricas">Herramientas Eléctricas</option>
            <option value="Tornilleria">Tornillería</option>
            <option value="Seguridad">Seguridad</option>
            <option value="Plomeria">Plomería</option>
            <option value="Electricidad">Electricidad</option>
            <option value="Pintura">Pintura</option>
            <option value="Otros">Otros</option>
          </select>

          <label for="product-description">Descripción</label>
          <textarea id="product-description" rows="3" placeholder="Descripción corta del producto"></textarea>

          <label for="product-images">Imágenes (puedes subir varias)</label>
          <input id="product-images" type="file" accept="image/png,image/jpeg,image/webp" multiple>

          <div class="image-preview-block">
            <div class="image-preview-head">
              <p>Previsualización de imágenes</p>
              <small id="image-preview-note">Las imágenes existentes y nuevas se mostrarán aquí.</small>
            </div>
            <div id="image-preview" class="image-preview-grid" aria-live="polite"></div>
          </div>

          <div class="form-buttons">
            <button type="submit" id="save-button" class="cta-btn">Guardar producto</button>
            <button type="button" id="cancel-edit-button" class="muted-btn" hidden>Cancelar edición</button>
          </div>

          <p id="admin-message" class="status-msg"></p>
        </form>
      </article>

      <article class="admin-card">
        <h2>Productos actuales</h2>
        <div id="admin-product-list" class="admin-product-list">
          <p class="status-msg">Cargando productos...</p>
        </div>
      </article>
    </section>
  </main>

  <script type="module" src="./js/admin.js"></script>
</body>
</html>
