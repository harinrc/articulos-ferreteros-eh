<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin | Articulos Ferreteros EH</title>
  <link rel="icon" href="./assets/logo-ferreteria-eh.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <img src="./assets/logo-ferreteria-eh.png" alt="Logo Articulos Ferreteros EH">
    <h1>Panel Administrativo</h1>
    <p>Ingresa para gestionar productos del catalogo.</p>

    <form id="login-form" class="form-stack">
      <label for="email">Correo electronico</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="admin@correo.com">

      <label for="password">Contrasena</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="********">

      <button type="submit" class="cta-btn">Entrar</button>
      <p id="login-message" class="status-msg"></p>
    </form>

    <a href="./index.html" class="text-link">Volver al sitio publico</a>
  </main>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
